<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc"><title id="title">RSI / CoEvol training flow for Qwen3-VL</title><desc id="desc">A 5% supervised warm start alternates critic training, sampling on unlabeled questions, filtering, and LoRA supervised fine-tuning for four rounds.</desc><rect width="1600" height="760" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#161616">
<defs><marker id="rsi-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10Z" fill="#777"/></marker><marker id="rsi-loop-arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 11 5.5 0 11Z" fill="#bb0027"/></marker></defs>
<g fill="none" stroke="#777" stroke-width="2.4" marker-end="url(#rsi-arrow)">
<path d="M303 437.5H334"/><path d="M540 437.5H571"/><path d="M700 437.5H731"/>
<path d="M925 437.5H956"/><path d="M1133 437.5H1164"/><path d="M1316 437.5H1347"/>
<path d="M829.5 315V362"/>
</g>
<path d="M1435 510V605H438.5V513" fill="none" stroke="#bb0027" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#rsi-loop-arrow)"/>
<text x="80" y="65" text-anchor="start" font-size="34" fill="#161616" font-weight="700">RSI for Qwen3-VL: iterative critic and generator training</text><text x="80" y="107" text-anchor="start" font-size="24" fill="#585858" font-weight="400">Can unlabeled questions close the gap from 5% SFT to full supervised training?</text><rect x="80" y="365" width="223" height="145" fill="#f5dce3" stroke="#cb8194" stroke-width="1.5"/><path d="M80 367H303" stroke="#bb0027" stroke-width="4"/><text x="191.5" y="418.5" text-anchor="middle" font-size="22" fill="#161616" font-weight="700">5% LoRA SFT</text><text x="191.5" y="449.5" text-anchor="middle" font-size="18" fill="#585858" font-weight="400">Qwen3-VL-4B-Instruct</text><text x="191.5" y="473.5" text-anchor="middle" font-size="18" fill="#585858" font-weight="400">Starting checkpoint M₀</text><rect x="337" y="365" width="203" height="145" fill="white" stroke="#aaaaaa" stroke-width="1.5"/><text x="438.5" y="406.5" text-anchor="middle" font-size="22" fill="#161616" font-weight="700">Critic step</text><text x="438.5" y="437.5" text-anchor="middle" font-size="18" fill="#585858" font-weight="400">Distinguish reference</text><text x="438.5" y="461.5" text-anchor="middle" font-size="18" fill="#585858" font-weight="400">and generated</text><text x="438.5" y="485.5" text-anchor="middle" font-size="18" fill="#585858" font-weight="400">answers</text><rect x="574" y="365" width="126" height="145" fill="#f5dce3" stroke="#cb8194" stroke-width="1.5"/><path d="M574 367H700" stroke="#bb0027" stroke-width="4"/><text x="637.0" y="442.5" text-anchor="middle" font-size="22" fill="#161616" font-weight="700">Critic Cₜ</text><rect x="666" y="224" width="327" height="91" fill="white" stroke="#aaaaaa" stroke-width="1.5"/><text x="829.5" y="262.5" text-anchor="middle" font-size="22" fill="#161616" font-weight="700">Unlabeled pool</text><text x="829.5" y="293.5" text-anchor="middle" font-size="18" fill="#585858" font-weight="400">3,000 new examples per round</text><rect x="734" y="365" width="191" height="145" fill="white" stroke="#aaaaaa" stroke-width="1.5"/><text x="829.5" y="418.5" text-anchor="middle" font-size="22" fill="#161616" font-weight="700">Generator step</text><text x="829.5" y="449.5" text-anchor="middle" font-size="18" fill="#585858" font-weight="400">Cₜ samples 3</text><text x="829.5" y="473.5" text-anchor="middle" font-size="18" fill="#585858" font-weight="400">answers per example</text><rect x="959" y="365" width="174" height="145" fill="white" stroke="#aaaaaa" stroke-width="1.5"/><text x="1046.0" y="430.5" text-anchor="middle" font-size="22" fill="#161616" font-weight="700">Filtered samples</text><text x="1046.0" y="461.5" text-anchor="middle" font-size="18" fill="#585858" font-weight="400">P(M) &gt; 0.55</text><rect x="1167" y="365" width="149" height="145" fill="white" stroke="#aaaaaa" stroke-width="1.5"/><text x="1241.5" y="430.5" text-anchor="middle" font-size="22" fill="#161616" font-weight="700">LoRA SFT</text><text x="1241.5" y="461.5" text-anchor="middle" font-size="18" fill="#585858" font-weight="400">Cₜ, rank 8</text><rect x="1350" y="365" width="170" height="145" fill="#f5dce3" stroke="#cb8194" stroke-width="1.5"/><path d="M1350 367H1520" stroke="#bb0027" stroke-width="4"/><text x="1435.0" y="430.5" text-anchor="middle" font-size="22" fill="#161616" font-weight="700">Updated Qwen</text><text x="1435.0" y="461.5" text-anchor="middle" font-size="18" fill="#585858" font-weight="400">Mₜ₊₁</text><text x="80" y="337" text-anchor="start" font-size="28" fill="#bb0027" font-weight="700">Warm start</text><rect x="1280" y="323" width="21" height="15" fill="#f5dce3" stroke="#cb8194"/><text x="1310" y="337" text-anchor="start" font-size="18" fill="#585858" font-weight="400">Qwen checkpoint</text><text x="80" y="550" text-anchor="start" font-size="18" fill="#585858" font-weight="400">Weak base-model answers</text><text x="80" y="575" text-anchor="start" font-size="18" fill="#585858" font-weight="400">motivate the warm start.</text><text x="937" y="650" text-anchor="middle" font-size="22" fill="#bb0027" font-weight="700">Repeat for 4 rounds</text><text x="80" y="703" text-anchor="start" font-size="17" fill="#585858" font-weight="400">Adapted from Hu et al., Refining Large Language Models with Self-Generated Data Through Iterative Training,</text><text x="80" y="730" text-anchor="start" font-size="17" fill="#585858" font-weight="400">ICLR 2026 RSI Workshop, Fig. 1. Diagram shows the experimental design; completed results are reported below.</text></g></svg>